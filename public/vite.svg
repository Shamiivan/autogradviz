<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="autograd logo">
  <defs>
    <style>
      :root {
        --fg: #111111;      /* forward/data color */
        --bg: #ffffff;
        --grad: #C62828;    /* backward/grad color */
        --accent: #4F46E5;  /* node ring */
        --text: #222222;
      }
      .ring { fill: none; stroke: var(--accent); stroke-width: 10; }
      .node { fill: var(--bg); stroke: var(--accent); stroke-width: 6; }
      .fwd  { fill: none; stroke: var(--fg); stroke-width: 10; }
      .bwd  { fill: none; stroke: var(--grad); stroke-width: 10; stroke-dasharray: 14 10; }
      .arrow { fill: var(--fg); }
      .arrow-grad { fill: var(--grad); }
      .glyph { font: 700 64px/1 "Inter", system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Arial; fill: var(--text); }
      .word  { font: 600 24px/1 "Inter", system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Arial; fill: var(--text); letter-spacing: 0.02em; }
    </style>
    <!-- arrowheads -->
    <marker id="ah-fwd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" class="arrow"></path>
    </marker>
    <marker id="ah-bwd" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M10,0 L0,5 L10,10 Z" class="arrow-grad"></path>
    </marker>
  </defs>

  <!-- outer subtle ring -->
  <circle cx="128" cy="120" r="100" class="ring" opacity="0.25"></circle>

  <!-- forward (data) arc clockwise -->
  <path class="fwd" d="M48,120
                        a80,80 0 0 1 160,0" marker-end="url(#ah-fwd)"></path>

  <!-- backward (grad) arc counter-clockwise -->
  <path class="bwd" d="M208,120
                        a80,80 0 0 1 -160,0" marker-start="url(#ah-bwd)"></path>

  <!-- central node -->
  <circle cx="128" cy="120" r="40" class="node"></circle>
  <text x="128" y="142" text-anchor="middle" class="glyph">∂</text>

  <!-- label -->
  <text x="128" y="220" text-anchor="middle" class="word">autograd</text>
</svg>
